<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Jev Mission Control — Social Preview</title>
<style>
@font-face{font-family:Inter;src:url('fonts/inter-var.woff2') format('woff2');font-weight:700;font-display:block}
@font-face{font-family:VT323;src:url('fonts/vt323.woff2') format('woff2');font-weight:400;font-display:block}
:root{--pink:#F386A1;--ink:#1E1E1E;--magenta:#E551BA;--grey:#DEDEDE;--paper:#FEFEFE}
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:640px;overflow:hidden}body{background:var(--pink);color:var(--ink);font:26px VT323,'JetBrains Mono',monospace}
.texture{position:absolute;inset:0;width:1280px;height:640px}.frame{position:absolute;inset:16px;border:1px solid var(--ink)}.crop{position:absolute;width:16px;height:16px;border:solid var(--ink)}.tl{top:7px;left:7px;border-width:1px 0 0 1px}.tr{top:7px;right:7px;border-width:1px 1px 0 0}.bl{bottom:7px;left:7px;border-width:0 0 1px 1px}.br{bottom:7px;right:7px;border-width:0 1px 1px 0}
.tag{position:absolute;left:44px;top:42px;padding:6px 12px;background:var(--ink);color:var(--pink);border:1px dotted var(--pink);outline:2px solid var(--ink);font-size:23px;letter-spacing:1.4px}
h1{position:absolute;left:40px;top:101px;margin:0;font:700 88px/1.08 Inter,sans-serif;letter-spacing:-5px;white-space:nowrap}
.subtitle{position:absolute;top:214px;left:43px;background:var(--ink);color:var(--paper);padding:9px 15px;font-size:30px;line-height:32px;white-space:nowrap}
.window{position:absolute;left:44px;top:303px;width:430px;height:273px;background:var(--grey);border:2px solid var(--ink);box-shadow:inset 0 0 0 2px var(--paper),3px 3px 0 var(--ink)}
.bar{height:31px;background:var(--ink);color:var(--paper);padding:1px 10px;display:flex;justify-content:space-between;font-size:25px;line-height:28px;letter-spacing:1px}.controls{letter-spacing:4px}
.preview{position:relative;margin:12px auto;width:384px;height:216px;background:var(--pink);border:1px solid var(--ink);outline:2px solid var(--paper);display:flex;align-items:center;justify-content:center}.preview:before,.preview:after{content:'';position:absolute;background:var(--ink);opacity:.4}.preview:before{width:1px;height:100%}.preview:after{width:100%;height:1px}.placeholder{z-index:1;background:var(--pink);border:1px solid var(--ink);padding:7px 15px;font-size:25px}.signal{display:inline-block;width:9px;height:9px;background:var(--magenta);border:1px solid var(--ink);margin-right:9px}
.robot{position:absolute;left:727px;top:299px;width:410px;height:276px;shape-rendering:crispEdges}
footer{position:absolute;bottom:40px;right:44px;font-size:25px;line-height:25px;letter-spacing:.5px}
